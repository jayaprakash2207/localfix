[project]
name = "localfix-auth"
version = "0.1.0"
description = "LocalFix Feature 001: Authentication and Role-Based Access Control"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "argon2-cffi>=23.1",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  "psycopg[binary]>=3.1",
  "email-validator>=2.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's DI pattern is `param: T = Depends(...)` - Depends()/Query()/etc. are resolved
# per-request by FastAPI, not evaluated once as a shared mutable default (B008's usual concern).
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body",
  "fastapi.Header",
]

[tool.ruff.lint.per-file-ignores]
"src/infrastructure/db/migrations/versions/*" = ["E501"]  # alembic-autogenerated, not hand-edited
"tests/*" = ["E501"]  # test assertions/fixtures read better as one line than hard-wrapped

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
